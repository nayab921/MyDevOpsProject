apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-web
spec:
  replicas: 2 # Yeh 2 servers (pods) banayega load balancing ke liye
  selector:
    matchLabels:
      app: cloudops
  template:
    metadata:
      labels:
        app: cloudops
    spec:
      containers:
      - name: cloudops-container
        image: nayab010/mydevopsproject:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cloudops-service
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30001
  selector:
    app: cloudops